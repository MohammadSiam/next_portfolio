services:
  app-prod:
    image: next-portfolio:${PROD_TAG:-prod-latest}
    container_name: next-portfolio-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_ROOT_API_URL=${NEXT_PUBLIC_ROOT_API_URL:-}
        - NEXT_PUBLIC_TINYMCE_API_KEY=${NEXT_PUBLIC_TINYMCE_API_KEY:-}
        - NEXT_PUBLIC_WEB3FORMS_KEY=${NEXT_PUBLIC_WEB3FORMS_KEY:-}
    env_file:
      - .env.production
    ports:
      - "4000:3000"
    networks:
      - portfolio-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  portfolio-net:
    name: portfolio-net
    driver: bridge
